name: Build

on:
  push:
    tags: ['*']

permissions:
  contents: write

concurrency:
  group: velopack-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = ($env:GITHUB_REF_NAME).TrimStart('v')
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Tag '$env:GITHUB_REF_NAME' is not a valid SemVer 2 version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore .\ko-client.csproj -r win-x64

      - name: Publish
        run: >-
          dotnet publish .\ko-client.csproj
          -c Release
          -r win-x64
          --self-contained false
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\publish

      - name: Restore Velopack CLI
        run: dotnet tool restore

      - name: Download previous Velopack release metadata
        shell: pwsh
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:VPK_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releases = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/$env:REPOSITORY/releases?per_page=100"
          $hasVelopackFeed = @($releases | ForEach-Object { $_.assets.name }) -contains "releases.win.json"
          if (-not $hasVelopackFeed) {
            Write-Host "No previous Velopack feed found; building the first full release."
            exit 0
          }
          dotnet tool run vpk -- download github `
            --repoUrl "https://github.com/$env:REPOSITORY" `
            --outputDir .\Releases
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Pack Velopack release
        run: >-
          dotnet tool run vpk -- pack
          --packId FluxMeansFlex.KOClient
          --packVersion ${{ steps.version.outputs.version }}
          --packDir .\publish
          --mainExe "KO Client - DEADSHOT.io.exe"
          --packTitle "KO Client - DEADSHOT.io"
          --icon .\assets\favicon.ico
          --runtime win-x64
          --framework "net8.0-x64-desktop,webview2"
          --noPortable
          --outputDir .\Releases

      - name: Upload Velopack release
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet tool run vpk -- upload github
          --repoUrl https://github.com/${{ github.repository }}
          --publish
          --releaseName "KO Client - DEADSHOT.io ${{ steps.version.outputs.version }}"
          --tag ${{ github.ref_name }}
          --outputDir .\Releases
